mbol{font-size:48px;filter:drop-shadow(0 0 8px var(--g));animation:float 2.3s ease-in-out infinite}.attract small{color:#e9ddf2;font-weight:800;margin-top:9px;letter-spacing:.08em}.coin{margin-top:14px;color:var(--gold);font-size:11px;animation:blink 1.05s steps(1) infinite}.deck{position:absolute;left:12%;right:12%;top:262px;height:58px;background:linear-gradient(#39303f,#1b171f);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);border-top:2px solid #594c62}.stick{position:absolute;left:25%;top:12px;width:8px;height:28px;background:#151219;border-radius:5px;box-shadow:0 -11px 0 6px var(--stick)}.buttons{position:absolute;right:22%;top:19px;display:flex;gap:8px}.buttons i{width:16px;height:16px;border-radius:50%;background:var(--btn);box-shadow:inset 0 2px #fff5,0 2px 3px #000}.door{position:absolute;left:30%;right:30%;top:329px;height:24px;background:#07070a;border:2px solid #37333b}.door:after{content:"25¢";font-size:9px;color:#ffcf72;position:absolute;left:50%;top:4px;transform:translateX(-50%)}.plaque{position:absolute;left:14%;right:14%;bottom:14px;text-align:center;font-size:10px;color:#94889e;letter-spacing:.08em;text-transform:uppercase}.c1{--m1:#71315d;--m2:#26152e;--g:#ff6fb1;--sg:rgba(172,66,146,.38);--stick:#728bdc;--btn:#e56b65}.c2{--m1:#4a3a75;--m2:#171c39;--g:#9a7dff;--sg:rgba(106,88,205,.38);--stick:#d16f8e;--btn:#7bd4df}.c3{--m1:#536329;--m2:#18200f;--g:#9bbc0f;--sg:rgba(155,188,15,.4);--stick:#9bbc0f;--btn:#6e317f}.c4{--m1:#40516d;--m2:#151b29;--g:#7fd7ff;--sg:rgba(127,215,255,.28);--stick:#c9a2ff;--btn:#ff9b63}.c5{--m1:#786d49;--m2:#1b2435;--g:#e7c56c;--sg:rgba(127,215,255,.24);--stick:#7fd7ff;--btn:#d99a62}.wipZone{position:relative;z-index:3;max-width:820px;margin:12px auto 0;padding:0 16px 6px;text-align:center}.wipLabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffd86b;margin:0 0 7px;text-shadow:0 0 10px #ffd86b55}.wipHint{font-size:9px;color:#9c90a7;margin:-2px 0 9px}.wipCab{display:block;width:min(100%,360px);margin:0 auto;min-height:376px}.wipCab .body{background:repeating-linear-gradient(135deg,rgba(255,216,107,.075) 0 12px,transparent 12px 24px),linear-gradient(90deg,#171318,#3b3020 48%,#100e11);border-color:#ffd86b2b}.wipCab:before{content:'CURRENT BUILD';position:absolute;z-index:5;left:50%;top:72px;transform:translateX(-50%);padding:3px 8px;border-radius:999px;background:#ffd86b;color:#241b08;font-size:8px;font-weight:1000;letter-spacing:.12em;box-shadow:0 0 12px #ffd86b66}.wipCab .marquee{height:82px}.wipCab .bezel{top:98px;height:164px}.wipCab .deck{top:273px}.wipCab .door{top:340px}.wipCab{--m1:#9a792f;--m2:#332719;--g:#ffd86b;--sg:rgba(127,215,255,.22);--stick:#7fd7ff;--btn:#ff9b63}@media(max-width:560px){.wipCab{min-height:362px}.wipCab .bezel{height:151px}.wipCab .deck{top:260px}.wipCab .door{top:325px}}.wipZone{position:relative;z-index:3;max-width:820px;margin:12px auto 0;padding:0 16px 6px;text-align:center}.wipLabel{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#ffd86b;margin:0 0 7px;text-shadow:0 0 10px #ffd86b55}.wipHint{font-size:9px;color:#9c90a7;margin:-2px 0 9px}.wipCab{display:block;width:min(100%,360px);margin:0 auto;min-height:376px}.wipCab .body{background:repeating-linear-gradient(135deg,rgba(255,216,107,.075) 0 12px,transparent 12px 24px),linear-gradient(90deg,#171318,#3b3020 48%,#100e11);border-color:#ffd86b2b}.wipCab:before{content:'CURRENT BUILD';position:absolute;z-index:5;left:50%;top:72px;transform:translateX(-50%);padding:3px 8px;border-radius:999px;background:#ffd86b;color:#241b08;font-size:8px;font-weight:1000;letter-spacing:.12em;box-shadow:0 0 12px #ffd86b66}.wipCab .marquee{height:82px}.wipCab .bezel{top:98px;height:164px}.wipCab .deck{top:273px}.wipCab .door{top:340px}.wipCab{--m1:#9a792f;--m2:#332719;--g:#ffd86b;--sg:rgba(127,215,255,.22);--stick:#7fd7ff;--btn:#ff9b63}@media(max-width:560px){.wipCab{min-height:362px}.wipCab .bezel{height:151px}.wipCab .deck{top:260px}.wipCab .door{top:325px}}.footer{position:absolute;z-index:4;left:0;right:0;bottom:calc(var(--safeB) + 8px);text-align:center;color:#8e8299;font-size:10px;letter-spacing:.12em;text-transform:uppercase}#player{position:fixed;inset:0;z-index:30;background:#050408;display:none;flex-direction:column}.pt{height:calc(50px + var(--safeT));padding:var(--safeT) 10px 6px;display:flex;align-items:center;gap:8px;background:#0e0a13;border-bottom:1px solid #32263a}.back{height:38px;padding:0 13px;border-radius:10px;border:1px solid #55435f;background:#251c2b;font-weight:900}.title{font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{flex:1;min-height:0;background:#000}.frame iframe{width:100%;height:100%;border:0;background:#000;display:block}@keyframes float{50%{transform:translateY(-5px)}}@keyframes blink{50%{opacity:.25}}@media(max-width:560px){.cabinets{grid-template-columns:1fr;gap:24px;padding-left:22px;padding-right:22px;margin-top:0}.cabinet{min-height:338px;max-width:330px;width:100%;justify-self:center}.bezel{height:145px}.deck{top:247px}.door{top:311px}.floor{top:34%}.sign h1{font-size:27px}.sign p{font-size:9px}}</style></head><body><main class="arcade"><div class="ceiling"></div><div class="glow"></div><div class="floor"></div><header class="sign"><h1>PANDORA'S ARCADE</h1><p>Knowledge is the real high score</p></header><section class="wipZone"><div class="wipLabel">WORK IN PROGRESS</div><div class="wipHint">The active build lives here until it graduates to the main floor.</div><button class="cabinet wipCab" data-game="games/wip/index.html" data-title="WIP // GRID//BREAKER"><div class="body"></div><div class="marquee">WIP//<br>GRID BREAKER</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">✕</div><small>DECOMPOSE • CHARGE • COMBINE</small><div class="coin">PLAYTEST BUILD</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="door"></div><div class="plaque">CURRENT WORKING GAME</div></button></section><section class="cabinets"><button class="cabinet c1" data-game="games/brood-brawl/index.html" data-title="Brood Brawl"><div class="body"></div><div class="marquee">Brood<br>Brawl</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">🐉</div><small>DRAGON GENE BRAWLER</small><div class="coin">INSERT COIN</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="door"></div><div class="plaque">Unofficial fan prototype</div></button><button class="cabinet c2" data-game="games/hollow-constellation/index.html" data-title="The Hollow Constellation"><div class="body"></div><div class="marquee">The Hollow<br>Constellation</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">✦</div><small>DESCEND • LEARN • BEND RULES</small><div class="coin">INSERT COIN</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="door"></div><div class="plaque">Original prototype</div></button><button class="cabinet c3" data-game="games/relay-null/index.html" data-title="RELAY//NULL"><div class="body"></div><div class="marquee">RELAY//<br>NULL</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">▦</div><small>ROTATE • FIRE • LEARN THE EXCEPTION</small><div class="coin">INSERT COIN</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i></span></div><div class="door"></div><div class="plaque">Pocket relay puzzle cartridge</div></button><button class="cabinet c4" data-game="games/blackbox-saint/index.html" data-title="BLACKBOX//SAINT"><div class="body"></div><div class="marquee">BLACKBOX//<br>SAINT</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">◇</div><small>ROUTE • COMMIT • SURVIVE</small><div class="coin">INSERT COIN</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="door"></div><div class="plaque">Tactical routing machine</div></button><button class="cabinet c5" data-game="games/veil-gear/index.html" data-title="VEIL//GEAR"><div class="body"></div><div class="marquee">VEIL//<br>GEAR</div><div class="bezel"><div class="screen"><div class="attract"><div class="symbol">✧</div><small>TAG • SHIFT • FRACTURE</small><div class="coin">INSERT COIN</div></div></div></div><div class="deck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="door"></div><div class="plaque">Transforming sky-machine shooter</div></button></section><div class="footer">Tap a cabinet • Quarter not actually required</div></main><div id="player"><div class="pt"><button class="back" id="back">← ARCADE</button><div class="title" id="title"></div></div><div class="frame"><iframe id="gameFrame" allow="autoplay; fullscreen" title="Game"></iframe></div></div><script>(()=>{const p=document.getElementById('player'),f=document.getElementById('gameFrame'),t=document.getElementById('title');let audio=null,lastLaunch=0;function coin(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const n=audio.currentTime;[880,1320].forEach((q,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=q;g.gain.setValueAtTime(.0001,n+i*.055);g.gain.exponentialRampToValueAtTime(.035,n+i*.055+.008);g.gain.exponentialRampToValueAtTime(.0001,n+i*.055+.08);o.connect(g).connect(audio.destination);o.start(n+i*.055);o.stop(n+i*.055+.09)})}catch(_){}}function launch(b){if(performance.now()-lastLaunch<500)return;lastLaunch=performance.now();coin();t.textContent=b.dataset.title;f.src=b.dataset.game;p.style.display='flex';document.body.style.overflow='hidden';history.pushState({game:true},'',location.href.split('#')[0]+'#cabinet')}function close(back=false){f.src='about:blank';p.style.display='none';document.body.style.overflow='';if(back&&location.hash)history.back()}document.querySelectorAll('.cabinet[data-game]').forEach(b=>{let sx=0,sy=0,moved=false,active=false,pid=null;const LIMIT=12;b.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active=true;pid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false;b.classList.add('tap')},{passive:true});b.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid)return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>LIMIT){moved=true;b.classList.remove('tap')}},{passive:true});const end=e=>{if(!active||e.pointerId!==pid)return;active=false;b.classList.remove('tap');if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<=LIMIT){e.preventDefault();launch(b)}};b.addEventListener('pointerup',end,{passive:false});b.addEventListener('pointercancel',()=>{active=false;moved=true;b.classList.remove('tap')},{passive:true});b.addEventListener('click',e=>e.preventDefault())});document.getElementById('back').onclick=()=>close(true);addEventListener('popstate',()=>{if(p.style.display==='flex')close(false)});['contextmenu','selectstart','dragstart','gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{capture:true,passive:false}))})();</script></body></html>
