<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08060d">
<title>Pandora's Arcade</title>
<style>
:root{--ink:#f8f5ff;--muted:#bdb3ca;--neon:#dd6cff;--cyan:#63ecff;--gold:#ffd86b;--safeT:max(12px,env(safe-area-inset-top));--safeB:max(12px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;touch-action:manipulation}
html,body{margin:0;min-height:100%;background:#07050b;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
body{overflow-x:hidden}
button,a{font:inherit;color:inherit}
#arcade{min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#07050b 0 23%,#100b18 23% 44%,#1b1125 44% 100%)}
.ceiling{position:absolute;inset:0 0 auto;height:34vh;background:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(#08060d,#120c1a);background-size:52px 34px,52px 34px,auto;transform:perspective(440px) rotateX(-56deg);transform-origin:top;opacity:.82}
.wallGlow{position:absolute;left:50%;top:4vh;width:86vw;height:44vh;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(151,71,204,.2),rgba(0,0,0,0) 66%);pointer-events:none}
.sign{position:relative;z-index:2;padding:calc(var(--safeT) + 10px) 16px 4px;text-align:center;text-shadow:0 0 10px #d361ff,0 0 22px #6b2d9a}
.sign h1{margin:0;font-size:clamp(25px,7vw,52px);letter-spacing:.12em;font-weight:1000;color:#ffd8ff}.sign p{margin:4px 0 0;color:#a99bb6;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.floor{position:absolute;left:-12vw;right:-12vw;top:44%;bottom:-10%;background:radial-gradient(circle,#7b365e 0 3px,transparent 4px),radial-gradient(circle,#3f7f8c 0 2px,transparent 3px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),#29152d;background-size:46px 46px,59px 59px,56px 56px,56px 56px,auto;transform:perspective(430px) rotateX(55deg);transform-origin:top;filter:saturate(.8)}
.cabinets{position:relative;z-index:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:18px 16px calc(100px + var(--safeB));max-width:820px;margin:3vh auto 0;align-items:end}
.cabinet{position:relative;min-height:360px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 20px 17px rgba(0,0,0,.47));transform:translateZ(0);transition:transform .14s ease,filter .14s ease}.cabinet:active{transform:translateY(3px) scale(.985)}
.cabBody{position:absolute;inset:44px 7% 0;background:linear-gradient(90deg,#16121c,#312438 48%,#100d14);clip-path:polygon(9% 0,91% 0,100% 80%,86% 100%,14% 100%,0 80%);border:2px solid rgba(255,255,255,.07)}
.marquee{position:absolute;left:3%;right:3%;top:0;height:76px;display:flex;align-items:center;justify-content:center;padding:7px 14px;text-align:center;border-radius:13px 13px 6px 6px;border:2px solid rgba(255,255,255,.16);font-weight:1000;line-height:1.05;font-size:clamp(16px,4vw,25px);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 0 22px var(--glow),inset 0 0 18px rgba(255,255,255,.08);background:linear-gradient(180deg,var(--m1),var(--m2));text-shadow:0 2px #000,0 0 11px #fff7}
.screenBezel{position:absolute;left:16%;right:16%;top:91px;height:160px;background:#09090c;border:10px solid #1a171e;box-shadow:inset 0 0 0 2px #3f3444,0 7px 10px #0008;transform:perspective(320px) rotateX(-3deg)}
.screen{position:absolute;inset:8px;overflow:hidden;background:#0d1119;border-radius:42%/8%;box-shadow:inset 0 0 24px #000,0 0 13px var(--glow)}.screen:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.035) 50%,rgba(0,0,0,.055) 50%);background-size:100% 4px;pointer-events:none;mix-blend-mode:screen}
.attract{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px;text-align:center;background:radial-gradient(circle at 50% 38%,var(--screenGlow),#090711 66%);animation:flicker 4s infinite steps(1)}.attract .symbol{font-size:48px;filter:drop-shadow(0 0 8px var(--glow));animation:float 2.3s ease-in-out infinite}.attract small{color:#e9ddf2;font-weight:800;margin-top:9px;letter-spacing:.08em}.attract .coin{margin-top:14px;color:var(--gold);font-size:11px;animation:blink 1.05s steps(1) infinite}
.controlsDeck{position:absolute;left:12%;right:12%;top:262px;height:58px;background:linear-gradient(#39303f,#1b171f);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);border-top:2px solid #594c62}.stick{position:absolute;left:25%;top:12px;width:8px;height:28px;background:#151219;border-radius:5px;box-shadow:0 -11px 0 6px var(--stick)}.buttons{position:absolute;right:22%;top:19px;display:flex;gap:8px}.buttons i{width:16px;height:16px;border-radius:50%;background:var(--btn);box-shadow:inset 0 2px #fff5,0 2px 3px #000}
.coinDoor{position:absolute;left:30%;right:30%;top:329px;height:24px;background:#07070a;border:2px solid #37333b;border-radius:3px}.coinDoor:after{content:"25¢";font-size:9px;color:#ffcf72;position:absolute;left:50%;top:4px;transform:translateX(-50%)}.plaque{position:absolute;left:14%;right:14%;bottom:14px;text-align:center;font-size:10px;color:#94889e;letter-spacing:.08em;text-transform:uppercase}
.c1{--m1:#71315d;--m2:#26152e;--glow:#ff6fb1;--screenGlow:rgba(172,66,146,.38);--stick:#728bdc;--btn:#e56b65}.c2{--m1:#4a3a75;--m2:#171c39;--glow:#9a7dff;--screenGlow:rgba(106,88,205,.38);--stick:#d16f8e;--btn:#7bd4df}.future{opacity:.7;--m1:#31313b;--m2:#15151a;--glow:#777;--screenGlow:rgba(100,100,120,.18);--stick:#777;--btn:#777}.future .attract{filter:grayscale(1)}
.footer{position:absolute;z-index:4;left:0;right:0;bottom:calc(var(--safeB) + 8px);text-align:center;color:#8e8299;font-size:10px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
#player{position:fixed;inset:0;z-index:30;background:#050408;display:none;flex-direction:column}.playerTop{height:calc(50px + var(--safeT));padding:var(--safeT) 10px 6px;display:flex;align-items:center;gap:8px;background:#0e0a13;border-bottom:1px solid #32263a}.back{height:38px;padding:0 13px;border-radius:10px;border:1px solid #55435f;background:#251c2b;font-weight:900}.gameTitle{font-weight:900;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.playerFrame{flex:1;min-height:0;background:#000}.playerFrame iframe{width:100%;height:100%;border:0;background:#000;display:block}
@keyframes float{50%{transform:translateY(-5px)}}@keyframes blink{50%{opacity:.25}}@keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.92}99%{opacity:.97}}
@media(max-width:560px){.cabinets{grid-template-columns:1fr;gap:24px;padding-left:22px;padding-right:22px;margin-top:0}.cabinet{min-height:338px;max-width:330px;width:100%;justify-self:center}.screenBezel{height:145px}.controlsDeck{top:247px}.coinDoor{top:311px}.floor{top:34%}.sign h1{font-size:27px}.sign p{font-size:9px}.future{display:none}}
</style>
</head>
<body>
<main id="arcade"><div class="ceiling"></div><div class="wallGlow"></div><div class="floor"></div><header class="sign"><h1>PANDORA'S ARCADE</h1><p>Knowledge is the real high score</p></header><section class="cabinets" aria-label="Game cabinets">
<button class="cabinet c1" data-game="games/brood-brawl/index.html" data-title="Brood Brawl"><div class="cabBody"></div><div class="marquee">Brood<br>Brawl</div><div class="screenBezel"><div class="screen"><div class="attract"><div class="symbol">🐉</div><small>DRAGON GENE BRAWLER</small><div class="coin">INSERT COIN</div></div></div></div><div class="controlsDeck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="coinDoor"></div><div class="plaque">Unofficial fan prototype</div></button>
<button class="cabinet c2" data-game="games/hollow-constellation/index.html" data-title="The Hollow Constellation"><div class="cabBody"></div><div class="marquee">The Hollow<br>Constellation</div><div class="screenBezel"><div class="screen"><div class="attract"><div class="symbol">✦</div><small>DESCEND • LEARN • BEND RULES</small><div class="coin">INSERT COIN</div></div></div></div><div class="controlsDeck"><span class="stick"></span><span class="buttons"><i></i><i></i><i></i></span></div><div class="coinDoor"></div><div class="plaque">Original prototype</div></button>
<div class="cabinet future" aria-hidden="true"><div class="cabBody"></div><div class="marquee">???</div><div class="screenBezel"><div class="screen"><div class="attract"><div class="symbol">?</div><small>CABINET AWAITING A GAME</small></div></div></div><div class="controlsDeck"><span class="stick"></span><span class="buttons"><i></i><i></i></span></div><div class="coinDoor"></div></div>
</section><div class="footer">Tap a cabinet • Quarter not actually required</div></main>
<div id="player"><div class="playerTop"><button class="back" id="back">← ARCADE</button><div class="gameTitle" id="gameTitle"></div></div><div class="playerFrame"><iframe id="gameFrame" allow="autoplay; fullscreen" title="Game"></iframe></div></div>
<script>(()=>{const player=document.getElementById('player'),frame=document.getElementById('gameFrame'),title=document.getElementById('gameTitle');let audio=null;function coin(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime;[880,1320].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.055);g.gain.exponentialRampToValueAtTime(.035,now+i*.055+.008);g.gain.exponentialRampToValueAtTime(.0001,now+i*.055+.08);o.connect(g).connect(audio.destination);o.start(now+i*.055);o.stop(now+i*.055+.09)})}catch(_){}}function launch(btn){coin();title.textContent=btn.dataset.title;frame.src=btn.dataset.game;player.style.display='flex';document.body.style.overflow='hidden';history.pushState({game:true},'',location.href.split('#')[0]+'#cabinet')}function closeGame(push=false){frame.src='about:blank';player.style.display='none';document.body.style.overflow='';if(push&&location.hash)history.back()}document.querySelectorAll('.cabinet[data-game]').forEach(b=>{let t=0;b.addEventListener('touchend',e=>{e.preventDefault();t=performance.now();launch(b)},{passive:false});b.addEventListener('click',e=>{e.preventDefault();if(performance.now()-t<450)return;launch(b)})});document.getElementById('back').addEventListener('click',()=>closeGame(true));addEventListener('popstate',()=>{if(player.style.display==='flex')closeGame(false)});['contextmenu','selectstart','dragstart','gesturestart','gesturechange','gestureend'].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{capture:true,passive:false}))})();</script>
</body>
</html>
