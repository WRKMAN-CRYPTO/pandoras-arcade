name: Patch GRID BREAKER random problems
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-random-problems.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch random problems
        run: python scripts/patch_grid_breaker_random_problems.py
      - name: Verify and commit
        run: |
          grep -q "RANDOM PROBLEM PASS V1" games/wip/index.html
          grep -q "randomNormalProblem" games/wip/index.html
          grep -q "randomBossProblem" games/wip/index.html
          grep -q "gridBreakerRecentProblemsV2" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Randomize GRID BREAKER problems' || exit 0
          git push
