name: Install WIP cabinet
on:
  push:
    paths:
      - '.github/workflows/install-wip-cabinet.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build current WIP and patch arcade
        run: python scripts/install_wip_cabinet.py
      - name: Commit arcade WIP system
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html games/wip/index.html
          git commit -m 'Add persistent WIP cabinet and current VEIL GEAR art pass' || exit 0
          git push
