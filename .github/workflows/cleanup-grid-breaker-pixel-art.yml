name: Cleanup GRID BREAKER pixel art
on:
  push:
    paths:
      - '.github/workflows/cleanup-grid-breaker-pixel-art.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicated helper blocks
        run: python scripts/cleanup_grid_breaker_pixel_art.py
      - name: Commit cleanup
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Clean GRID BREAKER pixel art helpers' || exit 0
          git push
