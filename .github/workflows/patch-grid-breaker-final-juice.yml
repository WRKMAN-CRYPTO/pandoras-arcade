name: Patch GRID BREAKER final juice
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-final-juice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch final juice
        run: python scripts/patch_grid_breaker_final_juice.py
      - name: Verify and commit
        run: |
          grep -q "FINAL JUICE PASS V1" games/wip/index.html
          grep -q "milestoneJuice" games/wip/index.html
          grep -q "juiceRings" games/wip/index.html
          grep -q "juiceFreeze" games/wip/index.html
          grep -q "WARD BROKEN" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Give GRID BREAKER its final juice pass' || exit 0
          git push
