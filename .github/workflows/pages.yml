name: Deploy Pandora's Arcade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static smoke checks
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s games/wip/index.html
          test -s audio/rebel-reins-polished/index.html
          test -s audio/rebel-reins-polished/core.js
          test -s audio/rebel-reins-polished/scenes.js
          test -s audio/rebel-reins-polished/blackjack.js
          if grep -q '/pandoras-arcade/' audio/rebel-reins-polished/index.html; then
            echo 'Hard-coded /pandoras-arcade/ path found in polished Rebel Reins wrapper.'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          targets = re.findall(r'data-game="([^"]+)"', html)
          missing = [target for target in targets if not Path(target).is_file()]
          if not targets:
              raise SystemExit('No arcade cabinet targets found in index.html')
          if missing:
              raise SystemExit('Missing arcade targets: ' + ', '.join(missing))
          print(f'Smoke check passed for {len(targets)} arcade cabinet targets.')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
