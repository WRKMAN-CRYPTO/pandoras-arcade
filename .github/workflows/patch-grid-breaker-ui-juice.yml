name: Patch GRID BREAKER UI juice
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-ui-juice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI and particle polish
        run: python scripts/patch_grid_breaker_ui_juice.py
      - name: Commit WIP update
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Polish GRID BREAKER UI and particles' || exit 0
          git push