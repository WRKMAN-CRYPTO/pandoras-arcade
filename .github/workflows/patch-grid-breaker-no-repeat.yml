name: Patch GRID BREAKER no repeats
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-no-repeat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch problem generator
        run: python scripts/patch_grid_breaker_no_repeat.py
      - name: Commit generator fix
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Prevent consecutive GRID BREAKER problems' || exit 0
          git push
# trigger
