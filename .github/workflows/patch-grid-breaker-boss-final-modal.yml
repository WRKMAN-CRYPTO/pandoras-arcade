name: Patch GRID BREAKER boss final modal
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-boss-final-modal.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch boss final modal
        run: python scripts/patch_grid_breaker_boss_final_modal.py
      - name: Verify and commit
        run: |
          grep -q "BOSS FINAL MODAL PASS V1" games/wip/index.html
          grep -q "bossFinish?c.label" games/wip/index.html
          grep -q "vals.join(' + ')" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Compact GRID BREAKER boss final modal' || exit 0
          git push
# trigger
