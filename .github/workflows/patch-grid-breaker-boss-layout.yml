name: Patch GRID BREAKER boss layout
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-boss-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch boss layout
        run: python scripts/patch_grid_breaker_boss_layout.py
      - name: Verify patch markers
        run: |
          grep -q "Six readable boss chambers" games/wip/index.html
          grep -q "S.boss?.61:.47" games/wip/index.html
          grep -q "count=S.boss?4" games/wip/index.html
      - name: Commit
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Fix cramped GRID BREAKER boss layout' || exit 0
          git push
