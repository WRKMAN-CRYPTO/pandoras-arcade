name: Patch GRID BREAKER reactions combo
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-reactions-combo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch reactions and combo feedback
        run: python scripts/patch_grid_breaker_reactions_combo.py
      - name: Commit WIP update
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Add GRID BREAKER enemy reactions and combo escalation' || exit 0
          git push
