name: VEIL GEAR resonance drive
on:
  push:
    paths:
      - '.github/workflows/veil-gear-resonance-drive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix Drive interactions
        run: python scripts/veil_gear_drive_fix.py
      - name: Commit patch
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/veil-gear/index.html
          git commit -m 'Fix Resonance Drive fracture and graze interactions' || exit 0
          git push
# fix trigger
