name: Patch GRID BREAKER equal boss grid
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-equal-boss-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch equal boss grid
        run: python scripts/patch_grid_breaker_equal_boss_grid.py
      - name: Verify and commit
        run: |
          grep -q "EQUAL BOSS GRID PASS V1" games/wip/index.html
          grep -q "xs=edge(A.map(()=>1),gx,gw);ys=edge(B.map(()=>1),gy,gh)" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Make GRID BREAKER boss chambers equal size' || exit 0
          git push
# trigger
