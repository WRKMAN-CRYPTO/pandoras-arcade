name: Patch WIP lean mech
on:
  push:
    paths:
      - '.github/workflows/patch-wip-lean-mech.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current WIP mech only
        run: python scripts/patch_wip_lean_mech.py
      - name: Commit WIP art pass
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Update WIP VEIL GEAR lean mech silhouette' || exit 0
          git push
# trigger
