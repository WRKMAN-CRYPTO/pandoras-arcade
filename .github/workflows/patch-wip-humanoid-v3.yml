name: Patch WIP humanoid Gear v3
on:
  push:
    paths:
      - '.github/workflows/patch-wip-humanoid-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current WIP player art
        run: python scripts/patch_wip_humanoid_v3.py
      - name: Commit WIP art pass
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Replace WIP player with humanoid Gear v3 silhouette' || exit 0
          git push
