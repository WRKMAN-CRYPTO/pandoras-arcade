name: Patch WIP GRID BREAKER
on:
  push:
    paths:
      - '.github/workflows/patch-wip-grid-breaker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch WIP cabinet
        run: python scripts/patch_wip_grid_breaker.py
      - name: Commit cabinet update
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Point WIP cabinet to GRID BREAKER' || exit 0
          git push
# trigger
