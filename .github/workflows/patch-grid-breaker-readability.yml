name: Patch GRID BREAKER readability
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-readability.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch readability
        run: python scripts/patch_grid_breaker_readability.py
      - name: Verify and commit
        run: |
          grep -q "READABILITY PASS V1" games/wip/index.html
          grep -q "font-size:18px" games/wip/index.html
          grep -q "font-size:11px;line-height:1.35" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Improve GRID BREAKER readability' || exit 0
          git push
# trigger
