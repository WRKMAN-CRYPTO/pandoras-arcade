name: VEIL GEAR combat pass
on:
  push:
    paths:
      - '.github/workflows/veil-gear-combat-pass.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch VEIL GEAR
        shell: python
        run: |
          from pathlib import Path
          p=Path('games/veil-gear/index.html')
          text=p.read_text()
          text=text.replace("let pointer={down:false,x:0,y:0},player={x:0,y:0,r:12,inv:0};","let pointer={down:false,x:0,y:0},player={x:0,y:0,r:12,inv:0};\nconst TOUCH_LEAD=64;")
          text=text.replace(" {id:'choir',name:'Choir Needle',hp:40,r:14,speed:44,armor:'veil',note:'Veil reduces SKIRMISH tagging. BURST fractures it.'},\n {id:'archon'"," {id:'choir',name:'Choir Needle',hp:40,r:14,speed:44,armor:'veil',note:'Veil reduces SKIRMISH tagging. BURST fractures it.'},\n {id:'lancer',name:'Orbit Lancer',hp:46,r:16,speed:31,armor:'none',note:'Its fan leaves deliberate graze lanes between bullets.'},\n {id:'bell',name:'Vesper Bell',hp:48,r:17,speed:27,armor:'none',note:'Its slow halo rewards staying close enough to graze the ring.'},\n {id:'archon'")
          text=text.replace(" ['Pilgrim Skin','Graze radius is larger and Hull repairs 1 per 8 grazes.','graze']\n];"," ['Pilgrim Skin','Graze radius is larger and Hull repairs 1 per 8 grazes.','graze'],\n ['Halo Debt','Every third graze adds 1 TAG to the nearest enemy.','grazeTag'],\n ['Widow Rail','GEAR shots pierce any FRACTURED target, regardless of Resonance.','fractPierce'],\n ['Blue Heresy','SKIRMISH shots add double TAG to FRACTURED targets.','fractTag'],\n ['Grave Echo','GEAR detonations splash 35% of their bonus damage to nearby enemies.','splash'],\n ['Choir Furnace','BURST converts erased bullets into Fuel.','burstFuel'],\n ['Second Gospel','Detonating 6+ TAG refreshes FRACTURE for 1.5 seconds.','refresh']\n];")
          text=text.replace("let def=forceBoss?enemies[3]:pick(enemies.slice(0,3));","let def=forceBoss?enemies[5]:pick(enemies.slice(0,5));")
          old="""function enemyFire(e){
 let dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1,sp=e.id==='archon'?150:120;
 S.eshots.push({x:e.x,y:e.y+10,vx:dx/l*sp,vy:dy/l*sp,r:e.id==='archon'?5:4});
 if(e.id==='archon')S.eshots.push({x:e.x,y:e.y+10,vx:dx/l*sp+45,vy:dy/l*sp,r:4},{x:e.x,y:e.y+10,vx:dx/l*sp-45,vy:dy/l*sp,r:4})
}"""
          new="""function enemyFire(e){
 let dx=player.x-e.x,dy=player.y-e.y,l=Math.hypot(dx,dy)||1,sp=e.id==='archon'?150:120;
 if(e.id==='lancer'){let base=Math.atan2(dy,dx),speed=108;[-.46,-.23,0,.23,.46].forEach(a=>S.eshots.push({x:e.x,y:e.y+8,vx:Math.cos(base+a)*speed,vy:Math.sin(base+a)*speed,r:4}));return}
 if(e.id==='bell'){let n=10,speed=72,spin=(performance.now()/900)%6.28;for(let i=0;i<n;i++){let a=spin+i*(Math.PI*2/n);S.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,r:4})}return}
 S.eshots.push({x:e.x,y:e.y+10,vx:dx/l*sp,vy:dy/l*sp,r:e.id==='archon'?5:4});
 if(e.id==='archon')S.eshots.push({x:e.x,y:e.y+10,vx:dx/l*sp+45,vy:dy/l*sp,r:4},{x:e.x,y:e.y+10,vx:dx/l*sp-45,vy:dy/l*sp,r:4})
}"""
          text=text.replace(old,new)
          text=text.replace("let gain=has('tag')?1.5:1;\n   if(e.armor==='veil'&&!e.fract)gain*=.45;","let gain=has('tag')?1.5:1;\n   if(e.armor==='veil'&&!e.fract)gain*=.45;\n   if(e.fract&&has('fractTag'))gain*=2;\n   if(e.armor==='adaptive'){if(e.adapt==='skirmish')gain*=.45;e.adapt='skirmish'}")
          text=text.replace("if(e.tag>0){let bonus=Math.round(e.tag*4);d+=bonus;fl('DETONATE +'+bonus,e.x,e.y-28,'#ffd27b');if(has('refund'))S.fuel=Math.min(S.mfuel,S.fuel+e.tag*3);e.tag=0;learn('detonate','GEAR shots cash out TAG as bonus damage.')}","if(e.tag>0){let tags=e.tag,bonus=Math.round(tags*4);d+=bonus;fl('DETONATE +'+bonus,e.x,e.y-28,'#ffd27b');if(has('refund'))S.fuel=Math.min(S.mfuel,S.fuel+tags*3);if(has('splash'))S.enemies.forEach(o=>{if(o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<95){let splash=Math.max(1,Math.round(bonus*.35));o.hp-=splash;fl('ECHO -'+splash,o.x,o.y-20,'#ffd27b')}});if(has('refresh')&&tags>=6){e.fract=Math.max(e.fract,1.5);fl('FRACTURE HELD',e.x,e.y-40,'#c9a2ff')}e.tag=0;learn('detonate','GEAR shots cash out TAG as bonus damage.')}\n   if(e.fract&&has('fractPierce'))s.pierce=true;")
          text=text.replace("S.eshots=S.eshots.filter(b=>Math.hypot(b.x-player.x,b.y-player.y)>110);","let before=S.eshots.length;S.eshots=S.eshots.filter(b=>Math.hypot(b.x-player.x,b.y-player.y)>110);let erased=before-S.eshots.length;if(has('burstFuel')&&erased){let gain=Math.min(30,erased*2);S.fuel=Math.min(S.mfuel,S.fuel+gain);fl('+'+gain+' FUEL',player.x,player.y-30,'#e7ba67')}")
          text=text.replace("if(has('graze')&&S.chain%8===0)S.hp=Math.min(S.mhp,S.hp+1);learn('graze','Grazing bullets builds Resonance without taking damage.');","if(has('graze')&&S.chain%8===0)S.hp=Math.min(S.mhp,S.hp+1);if(has('grazeTag')&&S.chain%3===0&&S.enemies.length){let n=S.enemies.reduce((a,e)=>Math.hypot(e.x-player.x,e.y-player.y)<Math.hypot(a.x-player.x,a.y-player.y)?e:a,S.enemies[0]);n.tag=Math.min(8,n.tag+1);fl('+TAG',n.x,n.y-30,'#7fd7ff')}learn('graze','Grazing bullets builds Resonance without taking damage.');")
          text=text.replace("x.save();x.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*20)%2===0)x.globalAlpha=.35;","if(pointer.down){x.strokeStyle='rgba(180,210,240,.45)';x.lineWidth=1;x.beginPath();x.arc(pointer.x,pointer.y,10,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(pointer.x-14,pointer.y);x.lineTo(pointer.x+14,pointer.y);x.moveTo(pointer.x,pointer.y-14);x.lineTo(pointer.x,pointer.y+14);x.stroke();x.strokeStyle='rgba(127,215,255,.18)';x.beginPath();x.moveTo(pointer.x,pointer.y-8);x.lineTo(player.x,player.y+14);x.stroke()}\n x.save();x.translate(player.x,player.y);if(player.inv>0&&Math.floor(player.inv*20)%2===0)x.globalAlpha=.35;")
          text=text.replace("pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;try{C.setPointerCapture(e.pointerId)}","pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;player.x=clamp(pointer.x,18,W-18);player.y=clamp(pointer.y-TOUCH_LEAD,55,H-25);try{C.setPointerCapture(e.pointerId)}")
          text=text.replace("let tx=e.clientX-r.left,ty=e.clientY-r.top;player.x=clamp(tx,18,W-18);player.y=clamp(ty,55,H-25)","pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;player.x=clamp(pointer.x,18,W-18);player.y=clamp(pointer.y-TOUCH_LEAD,55,H-25)")
          text=text.replace("Drag anywhere on the battlefield.","Drag anywhere. The frame flies above your finger so you can see it.")
          text=text.replace("Drag to move • Autoguns fire continuously","Drag to steer • Frame leads your fingertip • Autoguns fire")
          p.write_text(text)
      - name: Commit patch
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/veil-gear/index.html
          git commit -m 'Improve VEIL GEAR touch visibility and combat interactions' || exit 0
          git push
# trigger 2
