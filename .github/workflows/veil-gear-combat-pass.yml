name: VEIL GEAR combat pass
on:
  push:
    paths:
      - '.github/workflows/veil-gear-combat-pass.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live game
        run: python scripts/veil_gear_combat_pass.py
      - name: Commit patch
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/veil-gear/index.html
          git commit -m 'Improve VEIL GEAR touch visibility and combat interactions' || exit 0
          git push
