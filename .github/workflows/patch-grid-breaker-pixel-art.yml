name: Patch GRID BREAKER pixel art
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-pixel-art.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply curriculum and pixel art pass
        run: python scripts/patch_grid_breaker_pixel_art.py
      - name: Commit WIP update
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Add shuffled curriculum and pixel art enemies to GRID BREAKER' || exit 0
          git push
