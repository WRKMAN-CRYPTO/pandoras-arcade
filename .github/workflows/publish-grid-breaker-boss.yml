name: Publish GRID BREAKER boss build
on:
  push:
    paths:
      - '.github/workflows/publish-grid-breaker-boss.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild WIP from staged chunks
        run: |
          cat .deploy/boss_chunk_0.txt .deploy/boss_chunk_1.txt .deploy/boss_chunk_2.txt .deploy/boss_chunk_3.txt .deploy/boss_chunk_4.txt | base64 -d > games/wip/index.html
          grep -q "BOSS // HUNDREDS CHAMBER" games/wip/index.html
          grep -q "585,93" games/wip/index.html
          grep -q "ARCHON OF HUNDREDS" games/wip/index.html
      - name: Commit boss build
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Add place-value boss floors to GRID BREAKER' || exit 0
          git push
