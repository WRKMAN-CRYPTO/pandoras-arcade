name: Patch WIP forward pose
on:
  push:
    paths:
      - '.github/workflows/patch-wip-forward-pose.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current WIP pose
        run: python scripts/patch_wip_forward_pose.py
      - name: Commit WIP pose pass
        run: |
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Turn WIP Gear toward the fight' || exit 0
          git push
