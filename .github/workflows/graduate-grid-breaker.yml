name: Graduate GRID BREAKER
on:
  push:
    paths:
      - '.github/workflows/graduate-grid-breaker.yml'
permissions:
  contents: write
jobs:
  graduate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Graduate game
        run: python scripts/graduate_grid_breaker.py
      - name: Verify and commit
        run: |
          test -f games/grid-breaker/index.html
          grep -q 'EQUAL BOSS GRID PASS V1' games/grid-breaker/index.html
          grep -q 'games/grid-breaker/index.html' index.html
          grep -q 'Decomposition dungeon crawler' index.html
          grep -q 'No active build' index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html games/grid-breaker/index.html
          git commit -m 'Graduate GRID BREAKER to permanent cabinet' || exit 0
          git push
