name: Patch GRID BREAKER equal normal grid
on:
  push:
    paths:
      - '.github/workflows/patch-grid-breaker-equal-normal-grid.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch normal grid geometry
        run: python scripts/patch_grid_breaker_equal_normal_grid.py
      - name: Verify and commit
        run: |
          grep -q "A.map(()=>1)" games/wip/index.html
          grep -q "B.map(()=>1)" games/wip/index.html
          git config user.name 'pandoras-arcade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add games/wip/index.html
          git commit -m 'Make normal GRID BREAKER chambers equal size' || exit 0
          git push
# trigger
