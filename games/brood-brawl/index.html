<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Brood Brawl</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171321;color:#fff;font:13px system-ui}#g{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#292047 0 34%,#566047 34% 72%,#21182e)}#hud{display:flex;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 10px 4px}.p{background:#171321dd;border:1px solid #ffffff20;border-radius:10px;padding:7px 9px}.bar{height:6px;background:#08070d;border-radius:10px;overflow:hidden;margin-top:4px}.f{height:100%;background:#75cf7c}.ap{background:#8b79d6}canvas{flex:1;width:100%;min-height:0}.genes{display:flex;gap:6px;justify-content:center;padding:4px}.genes button,.acts button{color:#fff;background:#241c34;border:1px solid #ffffff20;border-radius:11px;font-weight:900}.genes button{padding:8px}.genes .s{outline:2px solid #f2d66e;background:#43315a}.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:5px 8px max(8px,env(safe-area-inset-bottom))}.acts button{min-height:58px}.note{text-align:center;font-size:11px;min-height:18px;color:#d8cceb}</style><div id="g"><div id="hud"><div class="p"><b>RYU</b> <span id="hp"></span><div class="bar"><div id="hf" class="f"></div></div></div><div class="p"><b id="formName">Human</b> <span id="ap"></span><div class="bar"><div id="af" class="f ap"></div></div></div></div><canvas id="c"></canvas><div class="genes"><button class="s" data-g="Flame">🔥 Flame</button><button data-g="Force">⚔ Force</button><button data-g="Defender">🛡 Defender</button></div><div class="note" id="note"></div><div class="acts"><button id="l">◀</button><button id="atk">ATTACK</button><button id="sk">SKILL</button><button id="aw">AWAKEN</button><button id="r">▶</button></div></div><script>(()=>{const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D=1,last=0,keys={},sel=['Flame'],wave=0,msgT=0;const P={x:120,hp:120,mhp:120,ap:60,map:60,form:false,t:0,combo:0,cd:0};let es=[];function rs(){D=Math.min(devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();function form(){if(sel.includes('Flame')&&sel.includes('Force'))return'Flame Warrior';if(sel.includes('Flame')&&sel.includes('Defender'))return'Magma Dragon';if(sel.includes('Force')&&sel.includes('Defender'))return'Myrmidon';return sel[0]}function note(t){document.querySelector('#note').textContent=t;msgT=2}function spawn(){wave++;es=[];let n=1+Math.min(3,Math.floor(wave/2));for(let i=0;i<n;i++)es.push({x:W+80+i*85,hp:45+wave*5,mhp:45+wave*5,heat:0,crack:0,burn:0,type:i%3});note('Wave '+wave)}function hit(e,d){e.hp-=d;e.x+=18;if(sel.includes('Flame')&&P.form){e.heat++;if(e.heat>=3){e.burn=4;e.heat=0;note('IGNITE')}}if(sel.includes('Force')&&P.form){e.crack++;if(e.crack>=2)note('Armor cracked')}}function attack(){if(P.cd)return;P.cd=.18;P.combo=P.combo%3+1;for(const e of es)if(Math.abs(e.x-P.x)<75)hit(e,12*(P.combo===3?1.6:1))}function skill(){if(!P.form||P.ap<7)return note(P.form?'Need AP':'Awaken first');P.ap-=7;if(sel.includes('Flame')&&sel.includes('Force')){let n=0;for(const e of es)if(e.heat||e.crack||e.burn){e.hp-=22+(e.burn?8:0)+(e.crack?8:0);e.heat=e.crack=e.burn=0;n++}note(n?'Inferno Break detonated '+n:'Prime foes first')}else if(sel.includes('Flame')){for(const e of es)e.heat=Math.min(3,e.heat+2);note('Heat Wave +2 Heat')}else if(sel.includes('Force')){for(const e of es)if(Math.abs(e.x-P.x)<120){e.hp-=e.crack>=2?28:18;e.x+=50}note('Rending Rush')}else note('Defender stores power from hits')}function awake(){if(P.form){P.form=false;return}if(P.ap<20)return note('Need 20 AP');P.ap-=20;P.form=true;P.t=14;note('Accession: '+form())}document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{let g=b.dataset.g;if(sel.includes(g)){if(sel.length>1)sel=sel.filter(v=>v!==g)}else{if(sel.length===2)sel.shift();sel.push(g)}document.querySelectorAll('[data-g]').forEach(q=>q.classList.toggle('s',sel.includes(q.dataset.g)));note(form())});function bind(id,k){let b=document.querySelector(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1;b.setPointerCapture?.(e.pointerId)};b.onpointerup=b.onpointercancel=e=>{e.preventDefault();keys[k]=0}}bind('#l','l');bind('#r','r');document.querySelector('#atk').onclick=attack;document.querySelector('#sk').onclick=skill;document.querySelector('#aw').onclick=awake;function up(dt){P.cd=Math.max(0,P.cd-dt);if(P.form){P.t-=dt;P.ap=Math.max(0,P.ap-dt*1.5);if(P.t<=0||P.ap<=0)P.form=false}P.x+=((keys.r?1:0)-(keys.l?1:0))*150*dt;P.x=Math.max(35,Math.min(W-35,P.x));for(const e of es){e.x-=35*dt;if(e.burn>0){e.burn-=dt;e.hp-=2*dt}if(e.x<P.x+25){P.hp-=7*dt;e.x+=25;if(sel.includes('Defender')&&P.form)P.ap=Math.min(P.map,P.ap+2*dt)}}es=es.filter(e=>e.hp>0);if(!es.length)spawn();if(P.hp<=0){P.hp=P.mhp;P.ap=P.map;wave=Math.max(0,wave-1);spawn();note('Knowledge retained. Try a different gene pairing.')}if(msgT>0)msgT-=dt;document.querySelector('#hp').textContent=Math.ceil(P.hp);document.querySelector('#ap').textContent=Math.ceil(P.ap);document.querySelector('#hf').style.width=100*P.hp/P.mhp+'%';document.querySelector('#af').style.width=100*P.ap/P.map+'%';document.querySelector('#formName').textContent=(P.form?'◆ ':'')+form()}function dr(){x.clearRect(0,0,W,H);x.fillStyle='#27364a';for(let i=0;i<8;i++){let a=(i*150-wave*8)%W;x.fillRect(a,25,18,H-70);x.fillStyle='#355b42';x.beginPath();x.arc(a+8,30,40,0,7);x.fill();x.fillStyle='#27364a'}x.fillStyle='#5b5c45';x.fillRect(0,H*.6,W,H*.4);x.fillStyle='#1e1727';x.beginPath();x.ellipse(P.x,H*.74,24,8,0,0,7);x.fill();x.fillStyle=P.form?(sel.includes('Flame')?'#c85e42':'#8977bd'):'#526bb5';x.fillRect(P.x-12,H*.74-42,24,40);for(const e of es){x.fillStyle=e.type===0?'#70cf92':e.type===1?'#b48c57':'#8b6bc4';x.fillRect(e.x-18,H*.74-38,36,38);x.fillStyle='#0008';x.fillRect(e.x-22,H*.74+6,44,5);x.fillStyle='#ef6f77';x.fillRect(e.x-22,H*.74+6,44*e.hp/e.mhp,5);if(e.heat)x.fillText('HEAT '+e.heat,e.x-20,H*.74-48);if(e.crack>=2)x.fillText('BREAK',e.x-18,H*.74-58)}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;up(dt);dr();requestAnimationFrame(loop)}spawn();requestAnimationFrame(loop);['contextmenu','selectstart','dragstart','gesturestart'].forEach(t=>addEventListener(t,e=>e.preventDefault(),{passive:false,capture:true}))})();</script>
