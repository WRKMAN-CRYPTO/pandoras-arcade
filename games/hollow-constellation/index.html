</b><div>Focus <span id="fo"></span></div><div class="b"><div id="ff" class="f q"></div></div></div></div><canvas id="c"></canvas><div id="log">The observatory remembers.</div><div class="ess"><button class="s" data-e="Ember">🔥 Ember</button><button data-e="Stone">🜨 Stone</button><button data-e="Echo">✦ Echo</button></div><div class="n" id="n"></div><div class="act"><button id="st">STRIKE</button><button id="te">TECHNIQUE</button><button id="aw">AWAKEN</button><button id="co">CODEX</button></div></div><div class="modal" id="m"><div class="card"><h2 id="mt"></h2><div id="ml"></div></div></div><script>(()=>{let C=document.querySelector('#c'),x=C.getContext('2d'),W,H,D=1,last=0,sel=['Ember'],depth=1,relics=[],msg=0,form=0,formT=0;let meta=JSON.parse(localStorage.hollowArcade||'{}');const P={hp:92,mhp:92,fo:40,mfo:40,ward:0};const defs={Saint:{hp:68,p:11,c:'#54817d',note:'Water dampens Ember. Stone pressure makes its veins brittle.'},Hound:{hp:62,p:12,c:'#a5a9be',note:'Reflects Echo until Burning distorts the reflection.'},Knight:{hp:84,p:12,c:'#817967',note:'Armor blunts strikes. Mark reveals seams for Stone.'},Choir:{hp:70,p:10,c:'#78649e',note:'Steals Focus. Mark turns part of the theft back.'},Warden:{hp:128,p:15,c:'#5e527e',note:'Resists your active form until its Seal is broken.'}};const pool=[['Cinder Key','Burn lowers Ember resistance.'],['Fault Lens','Fracture splashes bonus damage.'],['Mirror Nail','Ward retaliates when struck.'],['Ashen Thread','Wet + Burn creates Steam instead of cancelling.'],['Grave Index','New codex knowledge restores Focus.']];let E;function rs(){D=Math.min(devicePixelRatio||1,2);W=C.clientWidth;H=C.clientHeight;C.width=W*D;C.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();function say(t){document.querySelector('#log').textContent=t;msg=2.4}function name(){if(sel.includes('Ember')&&sel.includes('Stone'))return'Furnace Eidolon';if(sel.includes('Ember')&&sel.includes('Echo'))return'Canticle Flame';if(sel.includes('Stone')&&sel.includes('Echo'))return'Fault Oracle';return sel[0]+' Aspect'}function desc(){if(sel.includes('Ember')&&sel.includes('Stone'))return'Burn + Fracture → MELT';if(sel.includes('Ember')&&sel.includes('Echo'))return'Burn + Mark → ECHOFLARE';if(sel.includes('Stone')&&sel.includes('Echo'))return'Mark exposes seams for Fracture';return sel[0]==='Ember'?'Build Burn':sel[0]==='Stone'?'Build Fracture + Ward':'Mark to reveal and twist'}function spawn(){let ks=Object.keys(defs),k=depth%5===0?'Warden':ks[Math.floor(Math.random()*4)],z=defs[k];E={k,hp:z.hp+depth*3,mhp:z.hp+depth*3,p:z.p+depth*.6,burn:0,wet:k==='Saint'?1:0,frac:0,mark:0,armor:k==='Knight'?2:0,seal:k==='Warden'?2:0};say('Depth '+depth+': '+k);up()}function know(key,text){meta[E.k]??={};if(!meta[E.k][key]){meta[E.k][key]=text;localStorage.hollowArcade=JSON.stringify(meta);if(relics.includes('Grave Index'))P.fo=Math.min(P.mfo,P.fo+4);say('Codex: '+text)}}function hurt(v,type){let m=1;if(type==='Ember'&&E.k==='Saint'&&E.wet)m=.4;if(type==='Echo'&&E.k==='Hound'&&!E.burn)m=.35;if(E.seal&&form)m=.45;if(type==='Physical'&&E.armor)m=.65;let d=Math.max(1,Math.round(v*m));E.hp-=d;return d}function tech(){if(P.fo<6)return say('Need Focus');P.fo-=6;if(sel.length===1){if(sel[0]==='Ember'){if(E.wet&&!relics.includes('Ashen Thread')){E.wet--;hurt(5,'Ember');say('Wet smothers the flame')}else{E.burn=2;hurt(9,'Ember');know('burn','Burn changes later interactions')}}else if(sel[0]==='Stone'){E.frac++;P.ward+=6;hurt(8,'Stone');if(E.frac>=2){E.armor=Math.max(0,E.armor-1);E.frac=0;hurt(7,'Stone');know('fracture','Repeated Stone can break protection')}}else{E.mark=2;hurt(6,'Echo');know('mark','Mark reveals and alters enemy rules')}}else if(sel.includes('Ember')&&sel.includes('Stone')){E.burn++;E.frac++;let b=E.burn&&E.frac?16:0;hurt(10+b,'Stone');if(b){E.armor=0;E.frac=0;know('melt','Burn + Fracture melts armor into damage')}}else if(sel.includes('Ember')&&sel.includes('Echo')){E.burn++;E.mark++;let b=E.burn&&E.mark?17:0;hurt(9+b,'Echo');if(b)know('flare','Burn + Mark creates Echoflare and bypasses reflection')}else{E.mark++;E.frac++;hurt(18,'Stone');if(E.mark)know('fault','Marked seams make Stone fracture easier')}turn()}function strike(){hurt(12,'Physical');turn()}function turn(){if(E.hp<=0)return win();let hit=Math.max(1,Math.round(E.p)-P.ward);P.ward=Math.max(0,P.ward-Math.round(E.p));P.hp-=hit;if(E.burn){E.hp-=5;E.burn--}if(E.wet)E.wet--;if(E.mark)E.mark--;if(E.seal)E.seal--;if(form&&--formT<=0)form=0;P.fo=Math.min(P.mfo,P.fo+2);if(E.hp<=0)return win();if(P.hp<=0){say('You wake at the entrance. Knowledge survived.');depth=Math.max(1,depth-1);P.hp=P.mhp;P.fo=P.mfo;setTimeout(spawn,700)}up()}function win(){depth++;P.hp=Math.min(P.mhp,P.hp+5);if(depth%3===0)choose();else setTimeout(spawn,500);up()}function choose(){let m=document.querySelector('#m');m.classList.add('on');document.querySelector('#mt').textContent='A relic wakes';let l=document.querySelector('#ml');l.innerHTML='';pool.filter(q=>!relics.includes(q[0])).sort(()=>Math.random()-.5).slice(0,3).forEach(q=>{let b=document.createElement('button');b.className='ch';b.innerHTML='<b>'+q[0]+'</b><div class=small>'+q[1]+'</div>';b.onclick=()=>{relics.push(q[0]);m.classList.remove('on');spawn()};l.appendChild(b)})}function codex(){let m=document.querySelector('#m');m.classList.add('on');document.querySelector('#mt').textContent='Field Codex';let l=document.querySelector('#ml');l.innerHTML='';for(const k of Object.keys(defs)){let d=document.createElement('div');d.className='ch';d.innerHTML='<b>'+k+'</b><div class=small>'+Object.values(meta[k]||{}).join('<br>')+'</div>';l.appendChild(d)}let b=document.createElement('button');b.className='ch';b.textContent='Return';b.onclick=()=>m.classList.remove('on');l.appendChild(b)}function up(){document.querySelector('#hp').textContent=Math.ceil(P.hp);document.querySelector('#fo').textContent=Math.ceil(P.fo);document.querySelector('#d').textContent=depth;document.querySelector('#r').textContent=relics.length;document.querySelector('#hf').style.width=100*P.hp/P.mhp+'%';document.querySelector('#ff').style.width=100*P.fo/P.mfo+'%';document.querySelector('#n').textContent=(form?'◆ ':'')+name()+' • '+desc()}document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{if(form)return say('Cannot reweave while awakened');let e=b.dataset.e;if(sel.includes(e)){if(sel.length>1)sel=sel.filter(v=>v!==e)}else{if(sel.length===2)sel.shift();sel.push(e)}document.querySelectorAll('[data-e]').forEach(q=>q.classList.toggle('s',sel.includes(q.dataset.e)));up()});document.querySelector('#st').onclick=strike;document.querySelector('#te').onclick=tech;document.querySelector('#aw').onclick=()=>{if(form){form=0;return up()}if(P.fo<12)return say('Need 12 Focus');P.fo-=12;form=1;formT=4;say('AWAKEN: '+name());up()};document.querySelector('#co').onclick=codex;function dr(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#21172f');g.addColorStop(1,'#202733');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#433b54';for(let i=-1;i<5;i++){let a=i*145-depth*9%145;x.fillRect(a+20,30,16,H*.5);x.fillRect(a,30,65,12)}let hy=H*.72,hx=W*.25;x.fillStyle='#4e5f91';x.fillRect(hx-10,hy-40,20,38);x.fillStyle='#e4d0b3';x.fillRect(hx-8,hy-52,16,13);if(form){x.strokeStyle=sel.includes('Ember')?'#e98261':sel.includes('Stone')?'#d8c879':'#a58de1';x.beginPath();x.arc(hx,hy-24,28,0,7);x.stroke()}if(E){let ex=W*.72,ey=H*.68;x.fillStyle=defs[E.k].c;x.fillRect(ex-25,ey-55,50,56);x.fillStyle='#0008';x.fillRect(ex-35,ey+16,70,6);x.fillStyle='#df6a73';x.fillRect(ex-35,ey+16,70*E.hp/E.mhp,6);x.fillStyle='#fff';x.textAlign='center';x.fillText(E.k,ex,ey-66);let t=[];if(E.burn)t.push('Burn '+E.burn);if(E.wet)t.push('Wet');if(E.frac)t.push('Fracture '+E.frac);if(E.mark)t.push('Mark');if(E.armor)t.push('Armor '+E.armor);if(E.seal)t.push('Seal');x.fillText(t.join(' • '),ex,ey+38);x.textAlign='left'}}function loop(t){last=t;dr();requestAnimationFrame(loop)}spawn();requestAnimationFrame(loop)
