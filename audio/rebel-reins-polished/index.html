<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#100a07"><title>REBEL//REINS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100a07;color:#f7e8d1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#100a07}.loadError{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:#100a07;z-index:10;text-align:center}.loadError.on{display:flex}.loadError div{max-width:420px;border:1px solid #7c5a42;background:#1a100c;padding:18px;line-height:1.5}.loadError b{display:block;margin-bottom:8px;color:#ffd49a}</style></head><body><iframe id="game" src="../rebel-reins/index.html" allow="autoplay"></iframe><div class="loadError" id="loadError"><div><b>REBEL//REINS FAILED TO LOAD</b>Refresh to retry. If it keeps failing, the polished game modules did not load correctly.</div></div><script>const f=document.getElementById('game'),err=document.getElementById('loadError');const asset=name=>new URL(name,location.href).href;f.addEventListener('load',()=>{const d=f.contentDocument;const load=(src)=>new Promise((ok,fail)=>{const s=d.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('Failed to load '+src));d.body.appendChild(s)});load(asset('core.js?v=5')).then(()=>load(asset('scenes.js?v=5'))).then(()=>load(asset('blackjack.js?v=5'))).catch(e=>{console.error('REBEL//REINS module load failure',e);f.style.display='none';err.classList.add('on')});});</script></body></html>
